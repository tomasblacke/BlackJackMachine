<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BlackJack Game</title>
        <link rel="stylesheet" href="index.css">

    </head>
    <body>
        <div class="body">
            <div class="main">
                <div class="titulo">
                    <section>
                        <h2>Black Jack: The Game</h2>
                    </section>
                </div>
                <p id="message-el">Let´s Play</p>
                <p>Bet $20 (Every Play Hand)</p>
            </div>
            <div class="mesa">
                <p id="cartas-cartel">Cards:</p>
                <p id="card-el"></p>
                <p id="sum-el"></p>
                <button id="startGame" onclick="startGame()">Play Hand</button>
                <br>
                <button id="newCard-el" onclick="newCard()">New Card</button>
                <br>
                <button id="stay-el" onclick="stayOption()">Stay</button>
                <br>
                <p id="dealer-el">Dealer Cards: </p>
                <br>
                <h3 id="broke-el" hidden>BROKE</h3>
                <button id="restart-el" hidden onclick="restart()">Restart</button>
            </div>
            <p id="player-el">User:</p>
            <div id="user-el"><!--Revisar-->
                <p>Type your name: </p>
                <input id="catch-el" type="text" placeholder="Name">
                <button id="set-username-el" onclick="setUsername()">Set Name</button>
            </div>
            <section id="audio">
                <audio id="myAudio" loop autoplay muted>
                    <source src="resources/Operator_AdobeStock_331468427_preview.mp3" type="audio/mpeg">
                    Tu navegador no soporta el elemento de audio.
                  </audio>  
                  <button id="mute-btn" onclick="toggleMute()">Mute / Unmute</button>
            </section>
            <footer>₢ Tomas Black</footer>
        </div>
        <script src="index.js"></script>
    </body>
</html>
